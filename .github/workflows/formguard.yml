name: FormGuard AI Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install z3-solver

    - name: Run FormGuard AI Verification
      run: |
        # Prüft beispielhaft eine Funktion mit der Sicherheitsinvariante final_price >= 0
        python cli.py -c "def calc(price, discount): return price * (1 - discount)" -i "final_price >= 0"